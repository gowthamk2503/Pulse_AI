version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulseai_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - CORS_ORIGINS=http://localhost,http://localhost:5173,http://localhost:80
      - EMOTION_MODEL_NAME=j-hartmann/emotion-english-distilroberta-base
      - PULSEAI_DB_PATH=/app/data/pulseai.db
    volumes:
      - pulseai_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulseai_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pulseai_data:
